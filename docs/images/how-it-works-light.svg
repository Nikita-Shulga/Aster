    <text x="689.3333333333334" y="152" fill="#18181B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">You choose</text>
    <text x="689.3333333333334" y="182" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">See before → after.</text><text x="689.3333333333334" y="204" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">Untick anything you</text><text x="689.3333333333334" y="226" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">want to keep.</text>
