    <text x="1216" y="98" text-anchor="end" fill="#71717A" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">STEP 4</text>
    <text x="1002" y="152" fill="#18181B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">Clean safely</text>
    <text x="1002" y="182" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">Caches are deleted, your</text><text x="1002" y="204" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">files go to the Trash,</text><text x="1002" y="226" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">registry is backed up.</text>
    </g>
  <g transform="translate(352.6666666666667 268)">
    <text x="0" y="17" fill="#71717A" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15.5">Every item gets a verdict:</text>
    <rect x="190" y="-4" width="146.39999999999998" height="30" rx="15" fill="#E6F6EC"/><text x="203" y="16" fill="#0D7A3B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Safe to delete</text><rect x="360" y="-4" width="112" height="30" rx="15" fill="#FFF4DD"/><text x="373" y="16" fill="#9A6200" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Read first</text><rect x="530" y="-4" width="146.39999999999998" height="30" rx="15" fill="#FDECEC"/><text x="543" y="16" fill="#B32424" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Better to keep</text>
  </g>
</svg>