    <text x="278" y="98" text-anchor="end" fill="#71717A" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">STEP 1</text>
    <text x="64" y="152" fill="#18181B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">Scan</text>
    <text x="64" y="182" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">Read-only. Nothing</text><text x="64" y="204" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">changes while Aster</text><text x="64" y="226" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">looks around.</text>
    </g><path d="M310 140H342.6666666666667" stroke="#5B4CF0" stroke-width="3" marker-end="url(#ar)"/>
  <g>
    <rect x="352.6666666666667" y="40" width="262" height="200" rx="18" fill="#FFFFFF" stroke="#E4E4E7"/>
    <rect x="374.6666666666667" y="62" width="52" height="52" rx="14" fill="#EEECFF"/>
    <g transform="translate(400.6666666666667 88)" fill="none" stroke="#5B4CF0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -12h28M-14 -2h28M-14 8h18"/></g>
    <text x="590.6666666666667" y="98" text-anchor="end" fill="#71717A" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">STEP 2</text>
    <text x="376.6666666666667" y="152" fill="#18181B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">Explain</text>
    <text x="376.6666666666667" y="182" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">Every item says what</text><text x="376.6666666666667" y="204" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">it is, what you lose</text><text x="376.6666666666667" y="226" fill="#52525B" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16.5">and whether it’s safe.</text>
    </g><path d="M622.6666666666667 140H655.3333333333334" stroke="#5B4CF0" stroke-width="3" marker-end="url(#ar)"/>
  <g>
    <rect x="665.3333333333334" y="40" width="262" height="200" rx="18" fill="#FFFFFF" stroke="#E4E4E7"/>
    <rect x="687.3333333333334" y="62" width="52" height="52" rx="14" fill="#EEECFF"/>
    <g transform="translate(713.3333333333334 88)" fill="none" stroke="#5B4CF0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-13 0l8 8l18 -18"/></g>
